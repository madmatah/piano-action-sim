[workspace]
resolver = "2"
members = [
    "crates/pa-core",
    "crates/pa-app",
    "crates/pa-wasm",
    "crates/pa-cli",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
# Matches the pin in rust-toolchain.toml. A lower MSRV would be a claim nothing
# tests.
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/madmatah/piano-action-sim"

[workspace.dependencies]
pa-core = { path = "crates/pa-core" }
pa-app = { path = "crates/pa-app" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
