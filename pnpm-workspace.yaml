packages:
  - "apps/*"
  # The wasm crate participates as an ordinary package, so Turborepo can order
  # the TypeScript build after the wasm build and cache its `pkg/` output. This
  # needs no Turborepo future flag: `experimentalCargoWorkspaces` maps `build` to
  # `cargo build`, which produces the wrong artefact for a cdylib and leaves
  # library builds uncached anyway.
  - "crates/pa-wasm"

# Locked as a block. The three.js tarball ships no .d.ts and declares no types
# dependency, so @types/three is a separately versioned third-party package that
# can drift from the runtime; and React Three Fiber caps React. Pinning them
# together means they move together or not at all.
catalog:
  three: 0.186.1
  "@types/three": 0.186.0
  "@react-three/fiber": 9.8.1
  "@react-three/drei": 10.7.9
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  vite: 8.3.4
  vitest: 5.0.3
