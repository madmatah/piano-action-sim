[package]
name = "pa-wasm"
description = "The only crate that knows about JavaScript. wasm-bindgen adapter over pa-app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pa-app.workspace = true
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
