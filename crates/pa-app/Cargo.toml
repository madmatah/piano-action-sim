[package]
name = "pa-app"
description = "Application layer: the single-key weighing bench as a use case, adapted by pa-wasm for the browser and by pa-cli for the shell."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# What each dependency is for. `serde`, with its derive, describes the
# documents an interface reads (`boundary`): settings, the sheet, diagnostics,
# the state and the scene, in codes and numbers; `serde_json` writes them,
# here and once, so the browser's adapter and the shell's read the same JSON.
# Neither reaches `pa-core`, which stays without them.
[dependencies]
pa-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `ts-rs` generates the TypeScript types of those documents from the Rust
# ones, in a test (`boundary::types`), into `crates/pa-wasm/types/`, and the
# test fails when the committed files differ: a field renamed here and not
# there is a failing test rather than a page reading what nobody sends. A
# dev-dependency, so nothing shipped links it.
[dev-dependencies]
ts-rs = "12"
